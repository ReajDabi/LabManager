# Local MySQL for testing schema/migration scripts.
# Matches the connection string in App.config: Server=localhost;Port=3306;Database=LabManagerDb;Uid=root;Pwd=;
#
#   docker compose up -d --wait   start (first start runs the init script)
#   docker compose down -v        stop and wipe the data, so the next start re-runs the init script
services:
  mysql:
    image: mysql:8.4
    container_name: labmanager-mysql
    # Table names are case-insensitive, same as MySQL on Windows
    command: --lower-case-table-names=1
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: LabManagerDb
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Scripts here only run when the data volume is empty
      - ./01_LabManager_Init_And_Seed.sql:/docker-entrypoint-initdb.d/01_LabManager_Init_And_Seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
